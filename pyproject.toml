[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-world-model"
version = "0.1.0"
description = "Multimodal JEPA foundation model for wireless-channel dynamics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
plots = ["matplotlib>=3.7", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wwm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
